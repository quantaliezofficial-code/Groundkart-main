# Deploy to the Hostinger VPS on every push to main, after CI passes.
#
# Repository secrets required:
#   DEPLOY_HOST      server IP or hostname
#   DEPLOY_USER      SSH user
#   DEPLOY_SSH_KEY   private key for that user (the public key in ~/.ssh/authorized_keys)
#   DEPLOY_PATH      checkout path on the server, e.g. /opt/groundkart
#
# One-time on the server: clone the repo to DEPLOY_PATH, create .env from
# deploy/.env.production.example, install Docker + compose plugin.
name: Deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --prune origin
            git reset --hard origin/main
            # Back up the database before migrations run.
            docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "predeploy-$(date +%Y%m%d-%H%M).dump" || true
            ls -1t predeploy-*.dump 2>/dev/null | tail -n +6 | xargs -r rm --
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 30); do
              if docker compose exec -T api curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then echo "healthy"; exit 0; fi
              sleep 4
            done
            echo "API did not become healthy"; docker compose logs --tail=80 api; exit 1
