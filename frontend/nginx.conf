# Serves the built SPA inside the "web" container, and proxies the API.
# TLS terminates in front of this (deploy/nginx-host.conf or Hostinger's proxy).

# Link-preview crawlers don't run JavaScript, so they get a small
# server-rendered page with the right Open Graph tags for each venue.
map $http_user_agent $is_link_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|applebot|googlebot|bingbot|embedly|redditbot|vkshare|w3c_validator)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 110m;   # 100 MB video ceiling + form overhead
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Trust the address only from the host proxy in front of this
    # container (Docker network / localhost); never from the client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
    }
    location /uploads/ {
        proxy_pass http://api:8000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location = /healthz { proxy_pass http://api:8000; }
    location /share/ { proxy_pass http://api:8000; }
    location = /sitemap.xml { proxy_pass http://api:8000; }
    location = /robots.txt { proxy_pass http://api:8000; }

    # Fingerprinted build output: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Venue and category pages: crawlers get the Open Graph page.
    location ~ ^/venues/([a-z0-9][a-z0-9_-]*)/?$ {
        if ($is_link_preview_bot) {
            rewrite ^/venues/(.*?)/?$ /share/venues/$1 last;
        }
        try_files $uri /index.html;
    }
    location ~ ^/categories/([a-z0-9][a-z0-9_-]*)/?$ {
        if ($is_link_preview_bot) {
            rewrite ^/categories/(.*?)/?$ /share/categories/$1 last;
        }
        try_files $uri /index.html;
    }

    location / {
        # index.html must never be cached, or a deploy isn't seen until the cache expires.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
