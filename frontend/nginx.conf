# Serves the built SPA inside the "web" container, and proxies the API.
# TLS terminates in front of this (deploy/nginx-host.conf or Hostinger's proxy).

# Link-preview crawlers don't run JavaScript, so they get a small
# server-rendered page with the right Open Graph tags for each venue.
map $http_user_agent $is_link_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|applebot|googlebot|bingbot|embedly|redditbot|vkshare|w3c_validator)" 1;
}

# Access log without credentials: guest booking manage tokens travel in the
# URL path, so they are replaced before the line is written. Referrers are
# not logged for the same reason. Kept for 365 days by the host's log
# rotation (docs/09-operations-and-deployment/DEPLOYMENT.md, "Logs").
map $request_uri $redacted_uri {
    "~^(?<gk_head>.*/bookings/manage/)[^/?]+(?<gk_tail>.*)$" "${gk_head}[redacted]${gk_tail}";
    "~^(?<gk_head>.*[?&]token=)[^&]+(?<gk_tail>.*)$" "${gk_head}[redacted]${gk_tail}";
    default $request_uri;
}
log_format groundkart '$remote_addr [$time_local] "$request_method $redacted_uri $server_protocol" '
                      '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 110m;   # 100 MB video ceiling + form overhead
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

    access_log /var/log/nginx/access.log groundkart;
    include /etc/nginx/snippets/security-headers.conf;

    # Trust the address only from the host proxy in front of this
    # container (Docker network / localhost); never from the client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # ---- Never served, whatever is (or is not) in the web root ----
    # Hidden files and folders: .env, .git, .htpasswd, .DS_Store... Only
    # /.well-known/ (certificate checks, security.txt) is allowed.
    location ^~ /.well-known/ { try_files $uri =404; }
    location ~ /\. { return 404; }
    # Source maps, server code, configs, dumps and archives. The SPA
    # fallback would otherwise answer these with index.html and a 200.
    location ~* \.(map|env|ini|conf|cfg|ya?ml|toml|lock|log|sql|sqlite3?|db|dump|bak|backup|old|orig|swp|py|pyc|sh|ts|tsx|md|zip|tar|gz|tgz|7z|rar|pem|key|crt|p12)$ {
        return 404;
    }
    location ~* ^/(backend|deploy|docs|scripts|backups|private-uploads|node_modules|src|alembic)(/|$) { return 404; }
    # FastAPI's interactive docs and schema are switched off in production;
    # make sure the web container never routes to them either.
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }

    # Signed-in areas are app routes, not pages to index.
    location ~ ^/(admin|owner|broker|account|my-bookings|bookings/manage)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        # Serve the app shell from this location so the headers above apply
        # (try_files would hand over to "location /" and drop them).
        rewrite ^ /index.html break;
    }

    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        # API answers are personal: never cache them in shared caches.
        proxy_hide_header X-Powered-By;
    }
    location /uploads/ {
        proxy_pass http://api:8000;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location = /healthz { proxy_pass http://api:8000; }
    location /share/ { proxy_pass http://api:8000; }
    location = /sitemap.xml { proxy_pass http://api:8000; }
    location = /robots.txt { proxy_pass http://api:8000; }

    # Fingerprinted build output: cache for a year.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /img/ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Venue and category pages: crawlers get the Open Graph page.
    location ~ ^/venues/([a-z0-9][a-z0-9_-]*)/?$ {
        if ($is_link_preview_bot) {
            rewrite ^/venues/(.*?)/?$ /share/venues/$1 last;
        }
        try_files $uri /index.html;
    }
    location ~ ^/categories/([a-z0-9][a-z0-9_-]*)/?$ {
        if ($is_link_preview_bot) {
            rewrite ^/categories/(.*?)/?$ /share/categories/$1 last;
        }
        try_files $uri /index.html;
    }

    location / {
        # index.html must never be cached, or a deploy isn't seen until the cache expires.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
