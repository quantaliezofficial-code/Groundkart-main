# Host-level nginx on the VPS: terminates TLS and forwards to the "web"
# container on 127.0.0.1:8080. Get certificates with:
#   sudo certbot --nginx -d groundkart.com -d www.groundkart.com
# Copy to /etc/nginx/sites-available/groundkart and symlink into sites-enabled.

server {
    listen 80;
    server_name groundkart.com www.groundkart.com;
    return 301 https://groundkart.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.groundkart.com;
    ssl_certificate     /etc/letsencrypt/live/groundkart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groundkart.com/privkey.pem;
    return 301 https://groundkart.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name groundkart.com;

    ssl_certificate     /etc/letsencrypt/live/groundkart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groundkart.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Overwrite, never append: the API rate-limits on this address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
