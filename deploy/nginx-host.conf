# Host-level nginx on the Hostinger VPS (the same nginx that serves Exotique):
# terminates TLS and forwards to the "web" container on 127.0.0.1:3002
# (WEB_PORT in .env). The web container serves the site and proxies /api to
# the API, so no api. subdomain is needed.
#
# 1. DNS: A records for groundkart.com and www.groundkart.com -> 187.127.208.215
# 2. Copy to /etc/nginx/sites-available/groundkart and symlink into
#    /etc/nginx/sites-enabled/. Comment out the two 443 server blocks until
#    the certificate exists, then:
#      certbot certonly --nginx -d groundkart.com -d www.groundkart.com
# 3. nginx -t && systemctl reload nginx
# Replace groundkart.com everywhere if the live domain differs.

# Same credential redaction as the web container (frontend/nginx.conf):
# guest booking manage tokens are in the URL path. Rotate this log daily and
# keep 365 days (CERT-In: at least 180 days in India; DPDP Rules r.6: 1 year).
map $request_uri $gk_host_redacted_uri {
    "~^(?<gk_head>.*/bookings/manage/)[^/?]+(?<gk_tail>.*)$" "${gk_head}[redacted]${gk_tail}";
    "~^(?<gk_head>.*[?&]token=)[^&]+(?<gk_tail>.*)$" "${gk_head}[redacted]${gk_tail}";
    default $request_uri;
}
log_format groundkart_host '$remote_addr [$time_local] "$request_method $gk_host_redacted_uri $server_protocol" '
                           '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

server {
    listen 80;
    server_name groundkart.com www.groundkart.com;
    return 301 https://groundkart.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.groundkart.com;
    ssl_certificate     /etc/letsencrypt/live/groundkart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groundkart.com/privkey.pem;
    return 301 https://groundkart.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name groundkart.com;

    ssl_certificate     /etc/letsencrypt/live/groundkart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/groundkart.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_hide_header Strict-Transport-Security;   # the container sends one too
    access_log /var/log/nginx/groundkart.access.log groundkart_host;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 110m;
    server_tokens off;

    # Defence in depth: the web container already refuses these, but the
    # host must never serve them either (this file sits next to other sites).
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(map|env|sql|dump|bak|backup|old|swp|log|zip|tar|gz|tgz|7z|pem|key)$ { return 404; }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3002;   # WEB_PORT
        proxy_set_header Host $host;
        # Overwrite, never append: the API rate-limits on this address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
